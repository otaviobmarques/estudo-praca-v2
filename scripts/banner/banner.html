<!doctype html>
<!-- Banner de compartilhamento (Open Graph, 1200 × 630). Visual neutro da tela de login: atende as duas marcas.
     Gerado por scripts/gerar_banner.mjs (fotografia em PNG, otimizada para menos de 100 KB). -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url(../../public/fontes/Inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Nunito";src:url(../../public/fontes/Nunito.woff2) format("woff2");font-weight:200 1000}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#2B2F36;color:#fff;font-family:"Inter",sans-serif;position:relative}
.circ{position:absolute;right:-210px;top:-260px;width:760px;height:760px;border-radius:50%;background:#343943}
.circ2{position:absolute;right:120px;bottom:-330px;width:520px;height:520px;border-radius:50%;background:#30353D}
.barras{position:absolute;right:120px;bottom:118px;display:flex;align-items:flex-end;gap:34px}
.barras i{display:block;width:86px;border-radius:22px;background:#fff}
.barras i:nth-child(1){height:150px;opacity:.55}.barras i:nth-child(2){height:240px;opacity:.78}.barras i:nth-child(3){height:340px}
.conteudo{position:absolute;left:84px;top:78px;bottom:70px;width:640px;display:flex;flex-direction:column}
.logos{display:flex;align-items:center;gap:30px}.logos img{height:50px}.logos .div{width:1.5px;height:50px;background:rgba(255,255,255,.35)}
h1{margin-top:auto;font:300 56px/1.08 "Inter",sans-serif;letter-spacing:-.01em}
h1 b{display:block;font:900 80px/1.04 "Nunito",sans-serif;letter-spacing:-.01em;margin-top:4px}
p{margin-top:26px;font-size:25px;line-height:1.4;color:#D5D8DD;max-width:600px}
.rodape{margin-top:auto;padding-top:34px;font-size:18px;font-weight:600;color:#AEB3BB;letter-spacing:.02em}
</style></head>
<body><div class="circ"></div><div class="circ2"></div>
<div class="barras" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="conteudo">
  <div class="logos"><img src="../../public/auto-visao_logo-oficial_branco-integral.svg" alt="Auto Visão"><span class="div"></span><img src="../../public/royal-logo-horizontal-fundo-escuro.svg" alt="Royal Vistorias"></div>
  <h1>Gerador de<b>Estudo de Praça</b></h1>
  <p>Potencial de vistorias por cidade para a expansão das redes Auto Visão e Royal Vistorias.</p>
  <div class="rodape">Acesso restrito às equipes de expansão</div>
</div></body></html>
